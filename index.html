<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koktem Kitchen | Журналы</title>
<script src="./config.js"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f5f6;background:#0b151f;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #93ebd2;outline-offset:3px}.layout{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}aside{background:#111f2b;border-right:1px solid #2a404d;padding:24px 14px;display:flex;flex-direction:column;gap:18px}aside .brand{padding:8px 10px 23px;font-size:22px;font-weight:800;letter-spacing:-.6px}.brand b{color:#7ee1bf}.brand small{display:block;color:#8ca7b2;font-size:10px;letter-spacing:2px;margin-top:4px}.sidebar-nav{display:grid;gap:6px}.sidebar-nav button{text-align:left;border:0;padding:13px 12px;border-radius:12px;background:transparent;color:#bbd0d5}.sidebar-nav button.active{background:#205044;color:#e3fff0}.muted{color:#9cb1bd}.tiny{font-size:12px}.aside-bottom{margin-top:auto;color:#92aebb;border-top:1px solid #2a404d;padding:14px 8px;font-size:12px}main{min-width:0;max-width:1350px;width:100%;padding:30px clamp(14px,4vw,52px) 80px}.top{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap;margin-bottom:25px}.eyebrow{color:#83debd;letter-spacing:2px;font-size:11px;font-weight:800}.top h1{font-size:clamp(25px,3vw,37px);margin:5px 0;letter-spacing:-1px}.top p{margin:0;color:#92acba}.auth{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.chip{padding:7px 12px;border-radius:30px;background:#244136;color:#a4e7c8;font-size:12px}.btn{border:1px solid #3d5967;color:#e5f5f5;background:#213441;padding:11px 15px;border-radius:12px;min-height:44px}.primary{background:#158361;border-color:#158361;color:white;font-weight:700}.btn:hover{filter:brightness(1.1)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{background:linear-gradient(135deg,#1a303d,#14232f);border:1px solid #324b59;border-radius:18px;padding:20px;color:inherit;text-align:left;width:100%;min-width:0}.tile:hover{border-color:#69c8a7}.tile h3{margin:7px 0;font-size:18px}.tile .ico{display:inline-flex;width:45px;height:45px;align-items:center;justify-content:center;background:#25483f;border-radius:12px;font-size:23px}.tile .arrow{float:right;color:#99b2ba}.section{display:flex;align-items:center;justify-content:space-between;margin:22px 0 14px;flex-wrap:wrap;gap:10px}.section h2{font-size:19px;margin:0}.row{display:flex;align-items:stretch;gap:10px;margin:9px 0;min-width:0}.equipment{flex:1;display:flex;justify-content:space-between;gap:14px;align-items:center}.equipment .title{font-size:16px;font-weight:700}.equipment .summary{display:flex;gap:12px;flex-wrap:wrap;justify-content:end}.equipment .summary div{min-width:84px}.equipment .summary strong{font-size:18px;display:block}.equipment .summary label{display:block;font-size:11px;color:#a1b8c2}.action{width:114px;flex:0 0 114px;font-size:13px;padding:8px}.badge{display:inline-flex;background:#2b414e;color:#b7d4dd;border-radius:20px;padding:5px 9px;font-size:12px;margin-top:8px}.badge.ok{background:#1e503b;color:#9df0bf}.badge.wait{background:#4c3d27;color:#ffe0a1}.group{color:#82dfbb;margin:24px 0 8px;border-bottom:1px solid #324b59;padding-bottom:9px}.instruction{border:1px solid #34515c;border-radius:15px;background:#162a36;margin:17px 0}.instruction summary{cursor:pointer;padding:16px;font-weight:700}.instruction .inside{border-top:1px solid #34515c;padding:13px 18px;color:#bccdd7;white-space:pre-wrap;font-size:13px;max-height:370px;overflow:auto}.input{background:#101e2a;border:1px solid #405f6e;border-radius:10px;color:#f4fafa;padding:11px;min-height:45px;max-width:100%;font-size:16px}.tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:18px 0}.tools label,.form label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#b7d0d6}.search{flex:1;min-width:180px}.history{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}.reading{background:#182a36;border:1px solid #344a58;border-radius:15px;padding:17px}.reading .date{font-size:13px;color:#8fe0c4;font-weight:700;margin-bottom:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair strong{display:block;font-size:20px}.pair span{color:#a1b8c2;font-size:12px}.hero{padding:23px;background:#183a37;border:1px solid #376657;border-radius:17px}.hero h2{margin:4px 0}.form{max-width:650px;background:#172c39;border:1px solid #385161;padding:22px;border-radius:18px;display:grid;gap:16px}.form .input{width:100%}.error{color:#ffa4a4}.notice{padding:15px 17px;background:#213a39;border:1px solid #4b8675;border-radius:13px;margin-bottom:17px}.pre{white-space:pre-wrap}.back{margin-bottom:16px}.empty{border:1px dashed #3d5360;border-radius:16px;padding:25px;text-align:center;color:#a6bac4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:15px 0 26px}.stat{border:1px solid #324b59;background:#182a36;border-radius:14px;padding:17px}.stat strong{display:block;font-size:25px}.stat span{color:#9eb5c0;font-size:12px} @media(max-width:850px){.layout{display:block}aside{padding:12px 17px}.sidebar-nav,.aside-bottom{display:none}aside .brand{padding:0;font-size:19px}main{padding:20px 14px 45px}}@media(max-width:580px){.grid{grid-template-columns:1fr}.row{gap:7px}.tile{padding:14px}.equipment{align-items:flex-start;flex-direction:column;padding:13px}.equipment .summary{justify-content:start}.equipment .title{font-size:14px}.action{width:82px;flex-basis:82px;padding:7px;font-size:12px}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:20px}}
</style>
</head>
<body><div class="layout"><aside><div class="brand">Koktem <b>Kitchen</b><small>ПРОИЗВОДСТВЕННЫЕ ЖУРНАЛЫ</small></div><nav id="nav" class="sidebar-nav"></nav><div class="aside-bottom">Защищённый доступ · Google Sheets</div></aside><main><header class="top"><div><div class="eyebrow">KOKTEM KITCHEN · JOURNALS</div><h1 id="title">Производственные журналы</h1><p id="subtitle">Просмотр, заполнение и история</p></div><div class="auth"><span id="authstatus" class="chip">Не подключено</span><form id="login"><label for="password">Пароль приложения</label> <input id="password" type="password" required maxlength="256" autocomplete="current-password"> <button class="btn primary" type="submit">Войти</button></form><button id="logout" class="btn" type="button" hidden>Выйти</button></div></header><div id="notice" role="status" aria-live="polite"></div><div id="content"></div></main></div>
<script>
(()=>{
'use strict';
const cfg=window.KOKTEM_CONFIG||{}, $=x=>document.getElementById(x);
const st={token:null,types:[],today:'',journal:null,item:null,screen:'home',from:'',to:'',query:'',message:''};
const E=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
const B=(txt,cls,fn)=>{const x=E('button',cls,txt);x.type='button';x.addEventListener('click',fn);return x};
const formatDate=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'Нет даты';
const monthStart=s=>s?s.slice(0,7)+'-01':'';
const health=v=>({З:'Здоров',О:'Отсутствовал',Б:'Болен'}[v]||v);
const byDate=(item,date)=>(item.records||[]).filter(r=>r.date===date);
const display=(v,t)=>v==null||v===''?'Нет данных':t==='health'?health(v):String(v);
function alert(message,bad=false){const n=$('notice');n.replaceChildren();if(!message)return;const d=E('div','notice'+(bad?' error':''),message);n.append(d)}
function renderHeader(){const title=st.screen==='home'?'Производственные журналы':st.screen==='journal'?st.journal.label:st.screen==='form'?'Внести запись':st.item?.name||'Журнал';$('title').textContent=title;$('subtitle').textContent='Кухня «Коктем» · '+(st.today?formatDate(st.today):'');const nav=$('nav');nav.replaceChildren();nav.append(B('⌂ Главная',st.screen==='home'?'active':'',()=>{st.screen='home';render()}));st.types.forEach(j=>nav.append(B(j.icon+' '+j.label,st.journal?.type===j.id?'active':'',()=>openJournal(j.id))))}
async function requestApi(payload) {
  const res = await fetch(cfg.apiBaseUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), cache:'no-store'});
  let data;
  try { data = await res.json(); } catch { throw Error('Сервер вернул некорректный ответ'); }
  if (!res.ok) {
    if (res.status === 401 && payload.token && payload.token === st.token) logout();
    throw Error(data.error || 'Ошибка ' + res.status);
  }
  return data.result;
}
async function api(action, ...args) {
  if (!st.token) throw Error('Войдите в приложение');
  return requestApi({token:st.token, action, args});
}

async function login(event) {
  event.preventDefault();
  const form = $('login');
  const field = $('password');
  const submit = form.querySelector('button');
  const password = field.value;
  field.value = '';
  submit.disabled = true;
  alert('');
  try {
    const {token} = await requestApi({action:'login', password});
    const dashboard = await requestApi({action:'getDashboard', token, args:[]});
    st.types = dashboard.types.filter(type => type.available);
    st.today = dashboard.today;
    st.screen = 'home';
    st.token = token;
    $('authstatus').textContent = '● Подключено';
    form.hidden = true;
    $('logout').hidden = false;
    render();
  } catch (error) {
    alert(error.message, true);
    field.focus();
  } finally {
    submit.disabled = false;
  }
}
function logout(){st.token=null;st.types=[];st.today='';st.journal=null;st.item=null;st.screen='home';$('authstatus').textContent='Не подключено';$('login').hidden=false;$('logout').hidden=true;render();alert('Вы вышли из приложения.')}
function render(){renderHeader();const root=$('content');root.replaceChildren();if(!st.token){root.append(E('div','empty','Введите пароль для доступа к журналам.'));return}if(st.screen==='home')home(root);if(st.screen==='journal')journal(root);if(st.screen==='detail')detail(root);if(st.screen==='form')form(root)}
function home(root){const stats=E('div','stats');[['05','Типов журналов'],['●','Защищённый доступ'],['Sheets','Единая база']].forEach(([v,l])=>{const x=E('div','stat');x.append(E('strong','',v),E('span','',l));stats.append(x)});root.append(stats,E('div','section'));root.lastChild.append(E('h2','','Выберите журнал'));const grid=E('div','grid');st.types.forEach(t=>{const x=B('','tile',()=>openJournal(t.id));x.append(E('span','ico',t.icon),E('span','arrow','↗'),E('h3','',t.label),E('span','muted tiny','Открыть журнал →'));grid.append(x)});root.append(grid)}
async function openJournal(type){const root=$('content');root.replaceChildren(E('div','empty','Загрузка журнала…'));try{const d=await api('getJournal',type);st.journal=d;st.item=null;st.query='';st.screen='journal';alert('');render()}catch(e){alert(e.message,true);render()}}
function instructions(root){const h=st.journal.header||{},d=E('details','instruction');d.append(E('summary','','▤ Официальная шапка и пояснительная записка'));const x=E('div','inside');const lines=[h.officialTitle||'',...(h.approval||[]),'',...(h.paragraphs||[])];x.textContent=lines.filter(Boolean).join('\n\n');d.append(x);root.append(d)}
function journal(root){root.append(B('← Главная','btn back',()=>{st.screen='home';render()}));instructions(root);const exp=E('div','tile');exp.append(E('h3','','Скачать журнал с официальной шапкой'));const tools=E('div','tools');const a=dateInput('С',monthStart(st.today)),b=dateInput('По',st.today);tools.append(a.box,b.box,B('↓ Скачать PDF','btn primary',()=>download(a.input.value,b.input.value)));exp.append(tools);root.append(exp);const tools2=E('div','tools');const q=E('input','input search');q.placeholder='Поиск по оборудованию, цеху или сотруднику';q.type='search';q.value=st.query;tools2.append(q,E('span','badge',st.journal.items.length+' объектов'));root.append(tools2);const list=E('div');root.append(list);q.addEventListener('input',()=>{st.query=q.value;fillList(list)});fillList(list)}
function fillList(list){list.replaceChildren();const t=st.journal.type;const matches=st.journal.items.filter(x=>(x.name+' '+(x.department||'')+' '+(x.description||'')).toLowerCase().includes(st.query.toLowerCase()));if(!matches.length){list.append(E('div','empty','Объекты не найдены'));return}const groups=new Map();matches.forEach(x=>{const name=t==='temp'?(x.department||'Другой цех'):'';if(!groups.has(name))groups.set(name,[]);groups.get(name).push(x)});for(const [group,items]of groups){if(group)list.append(E('h3','group',group+' · '+items.length));items.forEach(item=>{const row=E('div','row');const c=B('','tile equipment',()=>{st.item=item;st.screen='detail';st.from=monthStart(st.today);st.to=st.today;render()});const left=E('div');left.append(E('div','title',item.name),E('div','tiny muted',t==='humidity'?item.hygrometer||item.description||'':item.description||''));const today=byDate(item,st.today);let badge='На сегодня данных нет';if(t==='temp'){badge=today.length>=2?'✓ Сегодня заполнено':today.length?'◷ Заполнено частично':'На сегодня данных нет'}else if(today.length)badge='✓ Заполнено сегодня';left.append(E('div','badge'+(today.length>=2||t!=='temp'&&today.length?' ok':today.length?' wait':''),badge));const right=E('div','summary');if(t==='temp'){[['День','День'],['Вечер','Вечер']].forEach(([label,key])=>{const rec=today.find(x=>x.label===key);const div=E('div');div.append(E('label','',label),E('strong','',rec?rec.value+' °C':'Нет данных'));right.append(div)})}else{const rec=today[today.length-1];const div=E('div');div.append(E('label','','Сегодня'),E('strong','',rec?display(rec.value,t):'Нет данных'));right.append(div)}c.append(left,right);row.append(c);if(['temp','health','humidity'].includes(t))row.append(B(t==='health'?'＋ Осмотр':'＋ Внести','btn primary action',()=>{st.item=item;st.screen='form';render()}));list.append(row)})}}
function dateInput(label,val){const box=E('label');box.append(E('span','tiny muted',label));const input=E('input','input');input.type='date';input.value=val;box.append(input);return {box,input}}
function detail(root){root.append(B('← К журналу','btn back',()=>{st.screen='journal';render()}));const j=st.journal,item=st.item;const hero=E('div','hero');hero.append(E('div','eyebrow','КАРТОЧКА ОБЪЕКТА'),E('h2','',item.name),E('div','muted tiny','Сегодня · '+formatDate(st.today)));const today=byDate(item,st.today);const pair=E('div','pair');if(j.type==='temp'){[['Дневные','День'],['Вечерние','Вечер']].forEach(([label,code])=>{const p=E('div');const rec=today.find(x=>x.label===code);p.append(E('span','',label),E('strong','',rec?rec.value+' °C':'Нет данных'));pair.append(p)})}else{pair.append(E('strong','',today.length?display(today[today.length-1].value,j.type):'Нет данных'))}hero.append(pair);root.append(hero);instructions(root);const actions=E('div','tools');if(['temp','health','humidity'].includes(j.type))actions.append(B(j.type==='health'?'＋ Осмотр':'＋ Внести','btn primary',()=>{st.screen='form';render()}));root.append(actions,E('div','section'));root.lastChild.append(E('h2','','История показаний'));const tools=E('div','tools');const a=dateInput('С',st.from),b=dateInput('По',st.to);tools.append(B('Этот месяц','btn',()=>{st.from=monthStart(st.today);st.to=st.today;render()}),a.box,b.box);root.append(tools);const history=E('div','history');root.append(history);[a,b].forEach(o=>o.input.addEventListener('change',()=>{st.from=a.input.value;st.to=b.input.value;fillHistory(history)}));fillHistory(history)}
function fillHistory(box){box.replaceChildren();if(st.from>st.to){box.append(E('div','empty','Проверьте даты периода'));return}const grouped=new Map();for(const r of st.item.records||[]){if(r.date<st.from||r.date>st.to)continue;if(!grouped.has(r.date))grouped.set(r.date,[]);grouped.get(r.date).push(r)}if(!grouped.size){box.append(E('div','empty','За выбранный период данных нет'));return}for(const date of [...grouped.keys()].sort().reverse()){const records=grouped.get(date),card=E('div','reading');card.append(E('div','date',formatDate(date)));if(st.journal.type==='temp'){const pair=E('div','pair');[['День','Дневные'],['Вечер','Вечерние']].forEach(([key,label])=>{const rec=records.find(r=>r.label===key),x=E('div');x.append(E('span','',label),E('strong','',rec?rec.value+' °C':'Нет данных'));pair.append(x)});card.append(pair)}else if(st.journal.type==='humidity'){const v=String(records[0].value);card.append(E('strong','',v.includes('%')?v:v+'%'))}else if(st.journal.type==='health'){card.append(E('strong','',health(records[0].value)))}else records.forEach(rec=>{card.append(E('strong','',rec.value));(rec.detail||[]).forEach(d=>{if(d.value)card.append(E('p','tiny muted',d.label+': '+d.value))})});box.append(card)}}
function textField(root,label,type,value){const l=E('label');l.append(E('span','',label));const i=E('input','input');i.type=type;i.value=value||'';l.append(i);root.append(l);return i}
function selectField(root,label,options){const l=E('label');l.append(E('span','',label));const s=E('select','input');options.forEach(([v,t])=>{const o=E('option','',t);o.value=v;s.append(o)});l.append(s);root.append(l);return s}
function form(root){const t=st.journal.type;root.append(B('← К карточке','btn back',()=>{st.screen='detail';st.from=monthStart(st.today);st.to=st.today;render()}));const f=E('form','form');f.append(E('h2','','Новая запись'),E('p','muted','Сохраняется в исходную таблицу Google Sheets'));const date=textField(f,'Дата','date',st.today);let val,period,who;if(t==='temp'){period=selectField(f,'Показание',[['День','Дневное'],['Вечер','Вечернее']]);val=textField(f,'Температура, °C','number','');val.step='.1';val.min='-60';val.max='60'}else if(t==='health')val=selectField(f,'Состояние',[['З','Здоров'],['О','Отсутствовал'],['Б','Болен']]);else if(t==='humidity'){val=textField(f,'Влажность, %','number','');val.min='0';val.max='100';who=textField(f,'Ответственное лицо','text','')}const err=E('p','error');const save=B('Сохранить в журнал','btn primary',()=>{});save.type='submit';f.append(err,save);f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';if(!date.value||!val.value||t==='humidity'&&!who.value.trim()){err.textContent='Заполните обязательные поля';return}save.disabled=true;save.textContent='Сохраняем…';try{const payload={type:t,itemId:st.item.id,date:date.value,value:val.value};if(period)payload.period=period.value;if(who)payload.responsible=who.value.trim();await api('saveReading',payload);const id=st.item.id;const j=await api('getJournal',t);st.journal=j;st.item=j.items.find(x=>x.id===id)||j.items[0];st.screen='detail';st.from=monthStart(st.today);st.to=st.today;render();alert('✓ Запись сохранена')}catch(error){err.textContent=error.message}finally{save.disabled=false;save.textContent='Сохранить в журнал'}});root.append(f)}
async function download(from,to){if(!from||!to||from>to){alert('Проверьте даты выгрузки',true);return}try{alert('Подготавливаем PDF…');const r=await api('exportJournalPdf',{type:st.journal.type,from,to});const bin=atob(r.base64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=E('a');a.href=url;a.download=r.filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);alert('PDF подготовлен. Записей: '+r.rows)}catch(e){alert(e.message,true)}}
$('login').addEventListener('submit',login);$('logout').addEventListener('click',logout);render();
})();
</script>
</body></html>
